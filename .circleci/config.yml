version: 2.0

jobs:
  build:
    branches:
      only:
        - master
        
    working_directory: ~/project
    
    docker:
      - image: circleci/buildpack-deps:bionic

    steps:
      - checkout:
          path: ~/project

      - run: sudo apt update
      - run:
          name: "Update Node.js and npm"
          command: |
            curl -sSL "https://nodejs.org/dist/v12.16.2/node-v12.16.2-linux-x64.tar.xz" | sudo tar --strip-components=2 -xJ -C /usr/local/bin/ node-v12.16.2-linux-x64/bin/node
            curl https://www.npmjs.com/install.sh | sudo bash
      - run:
          name: Check current version of node and npm
          command: |
            node -v
            npm -v

      - run:
          name: Install Dependencies and Build Initialize
          command: |
            sudo npm install -g javascript-obfuscator
            cd build
            sudo chmod ugo+x build.sh
            sudo chmod ugo+x deploy.sh

      - run:
          name: Build 🏗
          working_directory: ~/project/build
          command: ./build.sh
      - run:
          name: Deploy 🚀
          working_directory: ~/project/build
          command: |
            echo 'export COMMIT_MESSAGE=$(git log --format=%B -n 1 $CIRCLE_SHA1)' >> $BASH_ENV
            source $BASH_ENV

            ./deploy.sh